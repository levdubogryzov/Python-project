name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]

jobs:
  test-and-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libpango1.0-dev libcairo2-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install Python dependencies
        run: |
          pip install pydantic rich manim pytest pytest-cov sphinx sphinx-rtd-theme

      - name: Run Tests
        run: python -m pytest test/

      - name: Build Docs
        run: |
          mkdir -p docs/source
          sphinx-apidoc -o docs/source/ src/
          sphinx-build docs/source/ docs/build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
